name: Feature Request
description: Suggest a new skill, validator, or improvement to the pack.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new skill or a way to improve the pack? We'd love to hear about it!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the feature or improvement is.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this feature solving a specific problem or friction point?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
