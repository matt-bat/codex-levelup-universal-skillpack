name: Bug Report
description: Report a bug or operational failure in a skill or validator.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much detail as possible to help us reproduce and fix it.
  - type: input
    id: skill
    attributes:
      label: Impacted Skill
      description: Which skill(s) were in use when the bug occurred? (e.g., skill-governance, regression-prevention)
      placeholder: e.g., skill-governance
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: How can we reproduce this behavior?
      placeholder: |
        1. Set up a project with...
        2. Run the command...
        3. Observe the failure...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      description: What actually happened? (Include error messages if possible)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, and any relevant model info (e.g., Gemini 1.5 Pro).
    validations:
      required: false
